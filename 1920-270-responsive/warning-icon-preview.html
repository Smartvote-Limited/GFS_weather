<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Warning Icon Preview</title>
    <style>
        :root {
            --design-width: 1920;
            --design-height: 270;
            --stage-scale: min(calc(100vw / (var(--design-width) * 1px)), calc(100vh / (var(--design-height) * 1px)));
            --stage-width: calc(var(--design-width) * 1px * var(--stage-scale));
            --stage-height: calc(var(--design-height) * 1px * var(--stage-scale));
            --stage-blue: #0f3c96;
            --left-padding: calc(120px * var(--stage-scale));
            --right-padding: calc(120px * var(--stage-scale));
            --side-column-width: calc(240px * var(--stage-scale));
            --vertical-padding: calc(16px * var(--stage-scale));
            --logo-height: calc(220px * var(--stage-scale));
            --content-gap: calc(10px * var(--stage-scale));
            --content-padding-x: calc(28px * var(--stage-scale));
            --content-padding-y-top: calc(8px * var(--stage-scale));
            --content-padding-y-bottom: calc(10px * var(--stage-scale));
            --content-panel-offset-y: calc(10px * var(--stage-scale));
            --content-panel-offset-x: calc(22px * var(--stage-scale));
            --content-panel-radius: calc(18px * var(--stage-scale));
            --content-panel-shadow-y: calc(6px * var(--stage-scale));
            --content-panel-shadow-blur: calc(16px * var(--stage-scale));
            --weather-icon-size: calc(47.04px * var(--stage-scale));
            --weather-font-size: calc(38.08px * var(--stage-scale));
            --weather-item-gap: calc(5.6px * var(--stage-scale));
            --weather-row-height: calc(47.04px * var(--stage-scale));
            --weather-stack-gap: calc(8.96px * var(--stage-scale));
            --warning-row-gap: calc(2px * var(--stage-scale));
            --warning-column-gap: calc(2px * var(--stage-scale));
            --warning-row-height: calc(78.52px * var(--stage-scale));
            --weather-column-gap: calc(13.44px * var(--stage-scale));
            --title-font-size: calc(80px * var(--stage-scale));
            --title-font-size-en: calc(64px * var(--stage-scale));
            --time-font-size: calc(52px * var(--stage-scale));
            --time-font-size-en: calc(38px * var(--stage-scale));
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background: var(--stage-blue);
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: var(--stage-width);
            height: var(--stage-height);
            padding: var(--vertical-padding) var(--right-padding) var(--vertical-padding) var(--left-padding);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            background: var(--stage-blue);
            position: relative;
            overflow: hidden;
        }

        .logo {
            width: var(--side-column-width);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo img {
            height: var(--logo-height);
            width: auto;
            display: block;
        }

        .content {
            position: absolute;
            top: var(--vertical-padding);
            bottom: var(--vertical-padding);
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
            width: max-content;
            max-width: calc(100% - (var(--left-padding) + var(--side-column-width) + var(--right-padding) + var(--side-column-width)));
        }

        .content-copy {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            align-self: center;
            gap: var(--content-gap);
            padding: var(--content-padding-y-top) var(--content-padding-x) var(--content-padding-y-bottom);
            isolation: isolate;
        }

        .content-copy::before {
            content: "";
            position: absolute;
            inset: calc(-1 * var(--content-panel-offset-y)) calc(-1 * var(--content-panel-offset-x));
            background: rgba(15, 60, 150, 0.82);
            border-radius: var(--content-panel-radius);
            box-shadow: 0 var(--content-panel-shadow-y) var(--content-panel-shadow-blur) rgba(15, 60, 150, 0.14);
            z-index: -1;
        }

        #title {
            font-size: var(--title-font-size);
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(15, 60, 150, 0.45);
        }

        #hkt-time {
            font-size: var(--time-font-size);
            font-weight: 700;
            line-height: 1.05;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(15, 60, 150, 0.45);
        }

        body[data-language="en"] #title {
            font-size: var(--title-font-size-en);
        }

        body[data-language="en"] #hkt-time {
            font-size: var(--time-font-size-en);
        }

        .weather-zone {
            position: absolute;
            top: var(--vertical-padding);
            right: var(--right-padding);
            bottom: var(--vertical-padding);
            width: var(--side-column-width);
            z-index: 1;
            overflow: visible;
        }

        #warnsum {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        #warnsum img {
            width: var(--weather-icon-size);
            height: var(--weather-icon-size);
            margin: 0;
            flex: 0 0 auto;
            object-fit: contain;
        }

        .warning-column {
            position: absolute;
            left: 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            overflow: visible;
        }

        .summary-column {
            position: absolute;
            right: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            gap: var(--weather-stack-gap);
            min-width: 0;
        }

        .weather-item {
            display: inline-flex;
            align-items: center;
            gap: var(--weather-item-gap);
            height: var(--weather-row-height);
            max-width: 100%;
            white-space: nowrap;
            font-size: var(--weather-font-size);
            line-height: 1;
        }

        .weather-icon-invert {
            filter: invert(1);
        }

        .warning-list {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(2, var(--warning-row-height));
            align-items: center;
            row-gap: var(--warning-row-gap);
            column-gap: var(--warning-column-gap);
            width: max-content;
            max-height: 100%;
            overflow: hidden;
        }

        #warnsum img.warning-icon {
            width: auto;
            height: var(--warning-row-height);
            display: block;
        }
    </style>
</head>
<body data-language="en">
    <div class="container">
        <div class="logo">
            <img src="https://www.gfs.gov.hk/filemanager/template/common/images/logo-GFS.svg" alt="Logo">
        </div>
        <div class="content">
            <div class="content-copy">
                <div id="title">Government Flying Service</div>
                <div id="hkt-time">HKT Time: 10:29:23, 17/06/2026</div>
            </div>
        </div>
        <div class="weather-zone">
            <div id="warnsum">
                <div class="warning-column">
                    <div class="warning-list" id="warning-list"></div>
                </div>
                <div class="summary-column" id="summary-column"></div>
            </div>
        </div>
    </div>

    <script>
        const warningIcons = [
            "firey.gif",
            "firer.gif",
            "frost.gif",
            "vhot.gif",
            "cold.gif",
            "sms.gif",
            "raina.gif",
            "rainr.gif",
            "rainb.gif",
            "ntfl.gif",
            "landslip.gif",
            "tc1.gif",
            "tc3.gif",
            "tc8ne.gif",
            "tc8b.gif",
            "tc8d.gif",
            "tc8c.gif",
            "tc9.gif",
            "tc10.gif",
            "tsunami-warn.gif",
            "ts.gif"
        ];

        function createWeatherItem(iconSrc, value, invertIcon = false) {
            const item = document.createElement("div");
            item.className = "weather-item";

            const icon = document.createElement("img");
            icon.src = iconSrc;
            icon.alt = "";
            if (invertIcon) {
                icon.className = "weather-icon-invert";
            }

            const text = document.createElement("div");
            text.textContent = value;

            item.append(icon, text);
            return item;
        }

        function createWarningIcon(src) {
            const icon = document.createElement("img");
            icon.src = src;
            icon.alt = "";
            icon.className = "warning-icon";
            icon.addEventListener("load", syncPreviewLayout, { once: true });
            icon.addEventListener("error", syncPreviewLayout, { once: true });
            return icon;
        }

        const summaryColumn = document.getElementById("summary-column");
        summaryColumn.append(createWeatherItem("https://www.hko.gov.hk/images/HKOWxIconOutline/pic60.png", "26°C"));
        summaryColumn.append(createWeatherItem("https://img.icons8.com/ios/50/wet.png", "87%", true));
        summaryColumn.append(createWeatherItem("https://img.icons8.com/external-flaticons-lineal-color-flat-icons/64/external-uv-index-weather-flaticons-lineal-color-flat-icons-2.png", "1"));

        const warningList = document.getElementById("warning-list");
        warningIcons.forEach(fileName => {
            warningList.append(createWarningIcon(`https://www.hko.gov.hk/en/wxinfo/dailywx/images/${fileName}`));
        });

        function syncPreviewLayout() {
            const warnsum = document.getElementById("warnsum");
            const weatherZone = warnsum.parentElement;
            const baseSideWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--side-column-width")) || 240;
            const columnGap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--weather-column-gap")) || 12;
            const topOffset = Math.max(0, (warnsum.clientHeight - summaryColumn.offsetHeight) / 2);
            const warningWidth = warningList.scrollWidth;
            const requiredWidth = Math.max(baseSideWidth, Math.ceil(summaryColumn.offsetWidth + columnGap + warningWidth));

            weatherZone.style.width = `${requiredWidth}px`;
            summaryColumn.style.top = `${topOffset}px`;
            warningList.parentElement.style.top = `${topOffset}px`;
            warningList.parentElement.style.right = `${summaryColumn.offsetWidth + columnGap}px`;
        }

        syncPreviewLayout();
        window.addEventListener("resize", syncPreviewLayout);
    </script>
</body>
</html>
