<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=270, initial-scale=1.0, user-scalable=no">
    <title>Warning Icon Preview</title>
    <style>
        :root {
            --stage-width: 1920px;
            --stage-height: 270px;
            --stage-blue: #0f3c96;
            --left-padding: 120px;
            --right-padding: 120px;
            --side-column-width: 240px;
            --weather-scale: 1.12;
            --weather-row-height: calc(42px * var(--weather-scale));
            --weather-stack-gap: calc(8px * var(--weather-scale));
            --warning-icon-height-multiplier: 1.5;
            --warning-row-gap: 2px;
            --warning-column-gap: 2px;
            --warning-row-height: calc((3 * var(--weather-row-height) + 2 * var(--weather-stack-gap) - var(--warning-row-gap)) / 2);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: var(--stage-width);
            min-width: var(--stage-width);
            max-width: var(--stage-width);
            height: var(--stage-height);
            min-height: var(--stage-height);
            max-height: var(--stage-height);
            margin: 0;
            overflow: hidden;
            background: var(--stage-blue);
            color: #fff;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            align-items: stretch;
        }

        .container {
            width: 100%;
            height: 100%;
            padding: 16px var(--right-padding) 16px var(--left-padding);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            background: var(--stage-blue);
            position: relative;
        }

        .logo {
            width: var(--side-column-width);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo img {
            height: 220px;
            width: auto;
            display: block;
        }

        .content {
            position: absolute;
            top: 16px;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
            width: max-content;
            max-width: calc(100% - (var(--left-padding) + var(--side-column-width) + var(--right-padding) + var(--side-column-width)));
        }
        .content-copy {
            position: relative;
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            align-self: center;
            gap: 10px;
            padding: 8px 28px 10px;
            isolation: isolate;
        }
        .content-copy::before {
            content: "";
            position: absolute;
            inset: -10px -22px;
            background: rgba(15, 60, 150, 0.82);
            border-radius: 18px;
            box-shadow: 0 6px 16px rgba(15, 60, 150, 0.14);
            z-index: -1;
        }

        #title {
            font-size: 80px;
            font-weight: 700;
            line-height: 1;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(15, 60, 150, 0.45);
        }

        #hkt-time {
            font-size: 52px;
            font-weight: 700;
            line-height: 1.05;
            white-space: nowrap;
            text-shadow: 0 1px 2px rgba(15, 60, 150, 0.45);
        }

        .weather-zone {
            position: absolute;
            top: 16px;
            right: var(--right-padding);
            bottom: 16px;
            width: var(--side-column-width);
            z-index: 1;
            overflow: visible;
        }

        #warnsum {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        #warnsum img {
            width: calc(42px * var(--weather-scale));
            height: calc(42px * var(--weather-scale));
            margin: 0;
            flex: 0 0 auto;
            object-fit: contain;
        }

        .warning-column {
            position: absolute;
            left: 0;
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            overflow: visible;
        }

        .summary-column {
            position: absolute;
            right: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;
            gap: var(--weather-stack-gap);
            min-width: 0;
        }

        .weather-item {
            display: inline-flex;
            align-items: center;
            gap: calc(5px * var(--weather-scale));
            height: var(--weather-row-height);
            max-width: 100%;
            white-space: nowrap;
            font-size: calc(34px * var(--weather-scale));
            line-height: 1;
        }

        .weather-icon-invert {
            filter: invert(1);
        }

        .warning-list {
            display: grid;
            grid-auto-flow: column;
            grid-template-rows: repeat(2, var(--warning-row-height));
            align-items: center;
            row-gap: var(--warning-row-gap);
            column-gap: var(--warning-column-gap);
            width: max-content;
            max-height: 100%;
            overflow: hidden;
        }

        #warnsum img.warning-icon {
            width: auto;
            height: var(--warning-row-height);
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://www.gfs.gov.hk/filemanager/template/common/images/logo-GFS.svg" alt="Logo">
        </div>
        <div class="content">
            <div class="content-copy">
                <div id="title">Government Flying Service</div>
                <div id="hkt-time">HKT Time: 10:29:23, 17/06/2026</div>
            </div>
        </div>
        <div class="weather-zone">
            <div id="warnsum">
                <div class="warning-column">
                    <div class="warning-list" id="warning-list"></div>
                </div>
                <div class="summary-column" id="summary-column"></div>
            </div>
        </div>
    </div>

    <script>
        const warningIcons = [
            "firey.gif",
            "firer.gif",
            "frost.gif",
            "vhot.gif",
            "cold.gif",
            "sms.gif",
            "raina.gif",
            "rainr.gif",
            "rainb.gif",
            "ntfl.gif",
            "landslip.gif",
            "tc1.gif",
            "tc3.gif",
            "tc8ne.gif",
            "tc8b.gif",
            "tc8d.gif",
            "tc8c.gif",
            "tc9.gif",
            "tc10.gif",
            "tsunami-warn.gif",
            "ts.gif"
        ];

        function createWeatherItem(iconSrc, value, invertIcon = false) {
            const item = document.createElement("div");
            item.className = "weather-item";

            const icon = document.createElement("img");
            icon.src = iconSrc;
            icon.alt = "";
            if (invertIcon) {
                icon.className = "weather-icon-invert";
            }

            const text = document.createElement("div");
            text.textContent = value;

            item.append(icon, text);
            return item;
        }

        function createWarningIcon(src) {
            const icon = document.createElement("img");
            icon.src = src;
            icon.alt = "";
            icon.className = "warning-icon";
            icon.addEventListener("load", syncPreviewLayout, { once: true });
            icon.addEventListener("error", syncPreviewLayout, { once: true });
            return icon;
        }

        const summaryColumn = document.getElementById("summary-column");
        summaryColumn.append(createWeatherItem("https://www.hko.gov.hk/images/HKOWxIconOutline/pic60.png", "26°C"));
        summaryColumn.append(createWeatherItem("https://img.icons8.com/ios/50/wet.png", "87%", true));
        summaryColumn.append(createWeatherItem("https://img.icons8.com/external-flaticons-lineal-color-flat-icons/64/external-uv-index-weather-flaticons-lineal-color-flat-icons-2.png", "1"));

        const warningList = document.getElementById("warning-list");
        warningIcons.forEach(fileName => {
            warningList.append(createWarningIcon(`https://www.hko.gov.hk/en/wxinfo/dailywx/images/${fileName}`));
        });

        function syncPreviewLayout() {
            const warnsum = document.getElementById("warnsum");
            const weatherZone = warnsum.parentElement;
            const weatherScale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--weather-scale")) || 1;
            const baseSideWidth = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--side-column-width")) || 240;
            const columnGap = 12 * weatherScale;
            const topOffset = Math.max(0, (warnsum.clientHeight - summaryColumn.offsetHeight) / 2);
            const warningWidth = warningList.scrollWidth;
            const requiredWidth = Math.max(baseSideWidth, Math.ceil(summaryColumn.offsetWidth + columnGap + warningWidth));

            weatherZone.style.width = `${requiredWidth}px`;
            summaryColumn.style.top = `${topOffset}px`;
            warningList.parentElement.style.top = `${topOffset}px`;
            warningList.parentElement.style.right = `${summaryColumn.offsetWidth + columnGap}px`;
        }

        syncPreviewLayout();
        window.addEventListener("resize", syncPreviewLayout);
    </script>
</body>
</html>
